<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Despesa</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
</head>

<body>

    <header>
        <h1>Registrar Despesa</h1>
    </header>

    <main>
        <h2>Nova Despesa</h2>

        <form th:action="@{/despesas}" method="post" th:object="${despesa}">
            <label>Data:</label>
            <input type="date" th:field="*{data}" />

            <label>Descrição:</label>
            <input type="text" th:field="*{descricao}" placeholder="Ex: Aluguel" />

            <label>Valor (R$):</label>
            <input type="number" step="0.01" th:field="*{valor}" placeholder="Ex: 1500.00" />

            <input type="submit" value="Registrar" />
        </form>

        <div th:if="${mensagem != null}">
            <h3 th:text="${mensagem}" style="color: #28a745;"></h3>
        </div>

        <div class="cta-container" style="margin-top: 40px;">
            <a th:href="@{/}" class="cta-button cta-extrato">Voltar ao início</a>
        </div>

    </main>

</body>
</html>
